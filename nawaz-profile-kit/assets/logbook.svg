<svg width="1200" height="458" viewBox="0 0 1200 458" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience and education timeline"><defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22e8ff"/><stop offset="1" stop-color="#8b5cff"/></linearGradient>
<linearGradient id="accv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22e8ff"/><stop offset="1" stop-color="#8b5cff"/></linearGradient>
<linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22e8ff" stop-opacity=".85"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#121a24" stroke-width="1"/></pattern></defs><style>.t{font-family:ui-monospace,'JetBrains Mono','SF Mono','Fira Code','DejaVu Sans Mono',Consolas,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
