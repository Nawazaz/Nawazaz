@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}</style><g class="t"><rect x=".5" y=".5" width="1199" height="457" rx="14" fill="#0b0f14" stroke="#1f2a37"/><rect x="45" y="78" width="2" height="352" fill="#1f2a37"/><text x="40" y="54" font-size="12" fill="#22e8ff" font-weight="600" letter-spacing="4" text-anchor="start">EXPERIENCE</text><circle cx="46" cy="88" r="5" fill="#0b0f14" stroke="#22e8ff" stroke-width="2" /><text x="68" y="92" font-size="12" fill="#22e8ff" font-weight="600" letter-spacing="2" text-anchor="start">MAR – APR 2025</text><text x="68" y="118" font-size="16" fill="#e9f1f7" font-weight="700" letter-spacing="0" text-anchor="start">Data &amp; Sustainability Analyst Intern</text><text x="68" y="140" font-size="13" fill="#8b9bb0" font-weight="400" letter-spacing="0" text-anchor="start">Sustainalink · Sweden</text><text x="68" y="166" font-size="12.5" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">▸ Analysed 500+ surplus frozen meals to identify spoilage</text><text x="84" y="188" font-size="12.5" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">patterns.</text><text x="68" y="210" font-size="12.5" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">▸ Built a Power BI dashboard supporting food-waste reduction</text><text x="84" y="232" font-size="12.5" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">decisions.</text><text x="68" y="254" font-size="12.5" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">▸ Evaluated three circular reuse solutions and 15+ supplier</text><text x="84" y="276" font-size="12.5" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">partners.</text><circle cx="46" cy="318" r="5" fill="#0b0f14" stroke="#22e8ff" stroke-width="2" /><text x="68" y="322" font-size="12" fill="#22e8ff" font-weight="600" letter-spacing="2" text-anchor="start">SEP – NOV 2023</text><text x="68" y="348" font-size="16" fill="#e9f1f7" font-weight="700" letter-spacing="0" text-anchor="start">Android App Development Project</text><text x="68" y="370" font-size="13" fill="#8b9bb0" font-weight="400" letter-spacing="0" text-anchor="start">Combitech &amp; Kristianstad University</text><text x="68" y="396" font-size="12.5" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">▸ Built an Android app integrating Google Maps and Mapbox APIs.</text><text x="68" y="418" font-size="12.5" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">▸ Ran systematic testing and debugging to improve stability.</text><rect x="645" y="78" width="2" height="220" fill="#1f2a37"/><text x="640" y="54" font-size="12" fill="#8b5cff" font-weight="600" letter-spacing="4" text-anchor="start">EDUCATION</text><circle cx="646" cy="88" r="5" fill="#0b0f14" stroke="#8b5cff" stroke-width="2" /><text x="668" y="92" font-size="12" fill="#8b5cff" font-weight="600" letter-spacing="2" text-anchor="start">2025 – 2027 (EXPECTED)</text><text x="668" y="118" font-size="16" fill="#e9f1f7" font-weight="700" letter-spacing="0" text-anchor="start">MSc Artificial Intelligence &amp; ML</text><text x="668" y="140" font-size="13" fill="#8b9bb0" font-weight="400" letter-spacing="0" text-anchor="start">Blekinge Institute of Technology · Sweden</text><text x="668" y="166" font-size="12.5" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">▸ Focus: machine learning, deep learning, LLM systems.</text><circle cx="646" cy="208" r="5" fill="#0b0f14" stroke="#8b5cff" stroke-width="2" /><text x="668" y="212" font-size="12" fill="#8b5cff" font-weight="600" letter-spacing="2" text-anchor="start">GRADUATED 2025</text><text x="668" y="238" font-size="16" fill="#e9f1f7" font-weight="700" letter-spacing="0" text-anchor="start">BSc Computer Science Engineering (IoT)</text><text x="668" y="260" font-size="13" fill="#8b9bb0" font-weight="400" letter-spacing="0" text-anchor="start">Kristianstad University · Sweden</text><text x="668" y="286" font-size="12.5" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">▸ Thesis: AI-based plant monitoring with CNN disease detection.</text><line x1="600" y1="30" x2="600" y2="428" stroke="#1f2a37"/></g></svg>