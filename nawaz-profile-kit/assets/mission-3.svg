-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">Python</text></g><g><rect x="144.6" y="240" width="113.1" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="201.1" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">scikit-learn</text></g><g><rect x="266.7" y="240" width="69.6" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="301.5" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">Pandas</text></g><g><rect x="345.2" y="240" width="62.3" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="376.4" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">NumPy</text></g><g><rect x="416.5" y="240" width="47.8" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="440.4" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">NLP</text></g><g><rect x="473.3" y="240" width="62.3" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="504.5" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">VADER</text></g><line x1="896" y1="30" x2="896" y2="268" stroke="#1f2a37"/><text x="1032" y="159" font-size="54" fill="url(#acc)" font-weight="700" letter-spacing="2" text-anchor="middle">62%</text><text x="1032" y="187" font-size="11.5" fill="#8b9bb0" font-weight="600" letter-spacing="3" text-anchor="middle">TEST ACCURACY</text><text x="1032" y="207" font-size="10.5" fill="#55657a" font-weight="400" letter-spacing="1" text-anchor="middle">49,000+ tweets analysed</text></g></svg>