<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal card: about Nawaz">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="329" rx="12" fill="#0b0f14" stroke="#1f2a37"/>
  <!-- title bar -->
  <path d="M0.5 12.5a12 12 0 0 1 12-12H1187.5a12 12 0 0 1 12 12V44H0.5Z" fill="#10161e"/>
  <line x1="0" y1="44.5" x2="1200" y2="44.5" stroke="#1f2a37"/>
  <circle cx="30" cy="22" r="5.5" fill="#2a3441"/>
  <circle cx="52" cy="22" r="5.5" fill="#2a3441"/>
  <circle cx="74" cy="22" r="5.5" fill="#2a3441"/>
  <rect x="0" y="43" width="1200" height="1.5" fill="url(#acc)" opacity="0.35"/>

  <g font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="17">
    <text x="600" y="27" text-anchor="middle" font-size="13" fill="#5b6b7d" letter-spacing="2">nawaz@bth: ~/about</text>

    <!-- whoami -->
    <text x="40" y="92"><tspan fill="#3ddc84">❯</tspan> <tspan fill="#e6edf3">whoami</tspan></text>
    <text x="62" y="120" fill="#8b9bb0">Nawaz · MSc student in <tspan fill="#00e5ff">AI &amp; Machine Learning</tspan> @ BTH, Sweden</text>

    <!-- focus -->
    <text x="40" y="164"><tspan fill="#3ddc84">❯</tspan> <tspan fill="#e6edf3">cat focus.txt</tspan></text>
    <text x="62" y="192" fill="#8b9bb0"><tspan fill="#7c5cff">→</tspan> machine learning that holds up outside the training set</text>
    <text x="62" y="216" fill="#8b9bb0"><tspan fill="#7c5cff">→</tspan> clean pipelines, reproducible experiments</text>

    <!-- status -->
    <text x="40" y="260"><tspan fill="#3ddc84">❯</tspan> <tspan fill="#e6edf3">status --open-to</tspan></text>
    <text x="62" y="288" fill="#8b9bb0">grad programs · thesis work · working student · AI intern</text>

    <!-- prompt -->
    <text x="40" y="314"><tspan fill="#3ddc84">❯</tspan></text>
    <rect x="62" y="300" width="10" height="18" fill="#00e5ff">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
