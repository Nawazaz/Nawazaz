<svg width="1200" height="90" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Footer: thanks for stopping by">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7c5cff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="40" y="22" width="1120" height="1.5" fill="url(#fade)"/>
  <g font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'Courier New',monospace" text-anchor="middle">
    <text x="600" y="58" font-size="14" fill="#8b9bb0" letter-spacing="4">GG · THANKS FOR STOPPING BY</text>
    <text x="592" y="78" font-size="11" fill="#566679" letter-spacing="4">// EOF</text>
    <rect x="638" y="68" width="7" height="11" fill="#00e5ff"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
