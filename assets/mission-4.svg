<svg width="1200" height="298" viewBox="0 0 1200 298" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mission 4: AI-Based Plant Monitoring System"><defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22e8ff"/><stop offset="1" stop-color="#8b5cff"/></linearGradient>
<linearGradient id="accv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22e8ff"/><stop offset="1" stop-color="#8b5cff"/></linearGradient>
<linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22e8ff" stop-opacity=".85"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#121a24" stroke-width="1"/></pattern><clipPath id="mc10"><rect x="0" y="0" width="1200" height="298" rx="14"/></clipPath><linearGradient id="sg11" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22e8ff" stop-opacity="0"/><stop offset=".5" stop-color="#22e8ff" stop-opacity=".9"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/></linearGradient></defs><style>.t{font-family:ui-monospace,'JetBrains Mono','SF Mono','Fira Code','DejaVu Sans Mono',Consolas,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.blink{animation:blink 1.06s steps(1,end) infinite}
@keyframes sc{0%{transform:translateX(-120px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(1200px);opacity:0}}</style><g class="t"><rect x=".5" y=".5" width="1199" height="297" rx="14" fill="#0b0f14" stroke="#1f2a37"/><g clip-path="url(#mc10)"><rect x="0" y="0" width="150" height="298" fill="url(#sg11)" opacity=".07" style="animation:sc 9s linear 3.2s infinite"/></g><rect x="0" y="12" width="4" height="274" fill="url(#accv)"/><text x="66" y="46" font-size="12" fill="#22e8ff" font-weight="700" letter-spacing="3" text-anchor="start">MISSION 04</text><text x="182" y="46" font-size="12" fill="#55657a" font-weight="500" letter-spacing="3" text-anchor="start">·  IoT · COMPUTER VISION · THESIS</text><text x="1160" y="46" font-size="11.5" fill="#8b9bb0" font-weight="500" letter-spacing="2" text-anchor="end">JAN – JUN 2024</text><text x="66" y="80" font-size="22" fill="#e9f1f7" font-weight="700" letter-spacing="0" text-anchor="start">AI-Based Plant Monitoring System</text><text x="66" y="108" font-size="14" fill="#8b9bb0" font-weight="400" letter-spacing="0" text-anchor="start">Bachelor&#x27;s thesis: IoT monitoring with on-device disease detection.</text><text x="66" y="138" font-size="13" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">▸ Built an IoT system with environmental sensors, camera and automated irrigation.</text><text x="66" y="161" font-size="13" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">▸ Developed a CNN-based plant disease classifier on 18,000+ images (95% validation accuracy).</text><text x="66" y="184" font-size="13" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">▸ Raised real-world detection accuracy from 14% to 92% using 500 system-captured images.</text><text x="66" y="207" font-size="13" fill="#b9c6d4" font-weight="400" letter-spacing="0" text-anchor="start">▸ Delivered a cloud-based dashboard for live monitoring.</text><g><rect x="66.0" y="240" width="69.6" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="100.8" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">Python</text></g><g><rect x="144.6" y="240" width="98.6" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="193.9" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">TensorFlow</text></g><g><rect x="252.2" y="240" width="62.3" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="283.3" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">Keras</text></g><g><rect x="323.5" y="240" width="47.8" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="347.3" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">CNN</text></g><g><rect x="380.2" y="240" width="47.8" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="404.1" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">IoT</text></g><g><rect x="437.0" y="240" width="91.3" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="482.7" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">Azure IoT</text></g><line x1="896" y1="30" x2="896" y2="268" stroke="#1f2a37"/><text x="1032" y="159" font-size="54" fill="url(#acc)" font-weight="700" letter-spacing="2" text-anchor="middle">14→92%</text><text x="1032" y="187" font-size="11.5" fill="#8b9bb0" font-weight="600" letter-spacing="3" text-anchor="middle">REAL-WORLD ACCURACY</text><text x="1032" y="207" font-size="10.5" fill="#55657a" font-weight="400" letter-spacing="1" text-anchor="middle">via targeted augmentation</text></g></svg>