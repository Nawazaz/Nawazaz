<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nawaz — ML / AI Engineer">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#161d27" stroke-width="1"/>
    </pattern>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.45">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="14" fill="#0b0f14"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="14" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="14" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="none" stroke="#1f2a37"/>

  <!-- HUD corner brackets -->
  <g stroke="#00e5ff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M36 62V36H62"/>
    <path d="M1164 62V36H1138"/>
    <path d="M36 238V264H62"/>
    <path d="M1164 238V264H1138"/>
  </g>

  <g font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'Courier New',monospace">
    <!-- top label -->
    <text x="80" y="76" font-size="14" fill="#5b6b7d" letter-spacing="3">// PLAYER_01</text>
    <circle cx="1020" cy="71" r="4" fill="#3ddc84">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1034" y="76" font-size="14" fill="#8b9bb0" letter-spacing="3">ONLINE</text>

    <!-- name -->
    <text x="80" y="160" font-size="92" font-weight="700" fill="#e6edf3" letter-spacing="8">NAWAZ</text>
    <rect x="84" y="178" width="260" height="3" rx="1.5" fill="url(#acc)"/>

    <!-- role -->
    <text x="80" y="224" font-size="22" fill="url(#acc)" letter-spacing="5" font-weight="600">ML / AI ENGINEER</text>
    <text x="80" y="254" font-size="15" fill="#8b9bb0" letter-spacing="1">building models that generalize<tspan fill="#00e5ff">_</tspan></text>
    <rect x="402" y="241" width="9" height="16" fill="#00e5ff">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- HUD stat bars -->
    <g transform="translate(820 128)">
      <text x="0" y="0" font-size="13" fill="#5b6b7d" letter-spacing="3">TRAIN</text>
      <rect x="90" y="-10" width="240" height="6" rx="3" fill="#141b24"/>
      <rect x="90" y="-10" width="204" height="6" rx="3" fill="url(#acc)">
        <animate attributeName="width" from="0" to="204" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      </rect>

      <text x="0" y="34" font-size="13" fill="#5b6b7d" letter-spacing="3">DATA</text>
      <rect x="90" y="24" width="240" height="6" rx="3" fill="#141b24"/>
      <rect x="90" y="24" width="228" height="6" rx="3" fill="url(#acc)">
        <animate attributeName="width" from="0" to="228" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      </rect>

      <text x="0" y="68" font-size="13" fill="#5b6b7d" letter-spacing="3">SHIP</text>
      <rect x="90" y="58" width="240" height="6" rx="3" fill="#141b24"/>
      <rect x="90" y="58" width="180" height="6" rx="3" fill="url(#acc)">
        <animate attributeName="width" from="0" to="180" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      </rect>

      <text x="0" y="102" font-size="13" fill="#5b6b7d" letter-spacing="3">LEVEL</text>
      <text x="90" y="102" font-size="13" fill="#e6edf3" letter-spacing="3">MSc · AI &amp; ML</text>
    </g>
  </g>
</svg>
