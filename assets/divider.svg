<svg width="1200" height="28" viewBox="0 0 1200 28" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider"><defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22e8ff"/><stop offset="1" stop-color="#8b5cff"/></linearGradient>
<linearGradient id="accv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22e8ff"/><stop offset="1" stop-color="#8b5cff"/></linearGradient>
<linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22e8ff" stop-opacity=".85"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#121a24" stroke-width="1"/></pattern><linearGradient id="dl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22e8ff" stop-opacity="0"/><stop offset="1" stop-color="#22e8ff" stop-opacity=".75"/></linearGradient><linearGradient id="dr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cff" stop-opacity=".75"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/></linearGradient></defs><style>.t{font-family:ui-monospace,'JetBrains Mono','SF Mono','Fira Code','DejaVu Sans Mono',Consolas,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.blink{animation:blink 1.06s steps(1,end) infinite}
@keyframes sl{0%{transform:translateX(-26px);opacity:0}25%{opacity:1}75%{opacity:1}100%{transform:translateX(26px);opacity:0}}</style><g class="t"><rect x="40" y="13" width="518" height="2" fill="url(#dl)"/><rect x="642" y="13" width="518" height="2" fill="url(#dr)"/><g transform="translate(600 14)"><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" fill="none" stroke="#22e8ff" stroke-width="1.5"/><rect x="-2.5" y="-2.5" width="5" height="5" transform="rotate(45)" fill="#8b5cff" style="animation:pulse 2.6s ease-in-out infinite"/></g><circle cx="570" cy="14" r="2" fill="#22e8ff" style="animation:sl 3.2s ease-in-out infinite"/></g></svg>