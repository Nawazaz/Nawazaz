7"/><text x="100.8" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">Python</text></g><g><rect x="144.6" y="240" width="91.3" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="190.2" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">AI Agents</text></g><g><rect x="244.9" y="240" width="98.6" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="294.2" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">Kubernetes</text></g><g><rect x="352.5" y="240" width="76.8" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="390.9" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">Grafana</text></g><g><rect x="438.3" y="240" width="98.6" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="487.6" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">Prometheus</text></g><g><rect x="545.9" y="240" width="120.4" height="26" rx="7" fill="#10161e" stroke="#1f2a37"/><text x="606.1" y="257.2" font-size="12" fill="#e9f1f7" font-weight="400" letter-spacing="0" text-anchor="middle">OpenTelemetry</text></g><line x1="896" y1="30" x2="896" y2="268" stroke="#1f2a37"/><text x="1032" y="159" font-size="54" fill="url(#acc)" font-weight="700" letter-spacing="2" text-anchor="middle">SRE</text><text x="1032" y="187" font-size="11.5" fill="#8b9bb0" font-weight="600" letter-spacing="3" text-anchor="middle">INCIDENT INVESTIGATION</text><text x="1032" y="207" font-size="10.5" fill="#55657a" font-weight="400" letter-spacing="1" text-anchor="middle">private team repository</text></g></svg>