@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.blink{animation:blink 1.06s steps(1,end) infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes orb{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes shuttle{0%{transform:translateX(0)}50%{transform:translateX(618px)}100%{transform:translateX(0)}}</style><g class="t"><rect x=".5" y=".5" width="1199" height="309" rx="14" fill="#0b0f14" stroke="#1f2a37"/><rect x=".5" y=".5" width="1199" height="309" rx="14" fill="url(#grid)"/><rect x="40" y="30" width="265" height="156" rx="12" fill="#10161e" stroke="#1f2a37"/><g style="transform-origin:172.5px 90px;animation:float 3.2s ease-in-out 0.0s infinite"><polygon points="172.5,60.0 198.5,75.0 198.5,105.0 172.5,120.0 146.5,105.0 146.5,75.0" fill="none" stroke="url(#acc)" stroke-width="2.5"/><polygon points="172.5,77 182.5,90 172.5,103 162.5,90" fill="url(#acc)" style="animation:pulse 2.6s ease-in-out infinite"/></g><text x="172.5" y="146" font-size="14" fill="#e9f1f7" font-weight="700" letter-spacing="1" text-anchor="middle">MARVEL RIVALS</text><text x="172.5" y="168" font-size="11" fill="#22e8ff" font-weight="500" letter-spacing="3" text-anchor="middle">GRANDMASTER</text><rect x="325" y="30" width="265" height="156" rx="12" fill="#10161e" stroke="#1f2a37"/><g style="transform-origin:457.5px 90px;animation:float 3.6s ease-in-out 0.3s infinite"><circle cx="457.5" cy="90" r="18" fill="none" stroke="#ff4d9d" stroke-width="2"/><circle cx="457.5" cy="90" r="2.5" fill="#ff4d9d"/><line x1="425.5" y1="90" x2="447.5" y2="90" stroke="#ff4d9d" stroke-width="2" stroke-linecap="round"/><line x1="467.5" y1="90" x2="489.5" y2="90" stroke="#ff4d9d" stroke-width="2" stroke-linecap="round"/><line x1="457.5" y1="58" x2="457.5" y2="80" stroke="#ff4d9d" stroke-width="2" stroke-linecap="round"/><line x1="457.5" y1="100" x2="457.5" y2="122" stroke="#ff4d9d" stroke-width="2" stroke-linecap="round"/></g><text x="457.5" y="146" font-size="14" fill="#e9f1f7" font-weight="700" letter-spacing="1" text-anchor="middle">VALORANT</text><text x="457.5" y="168" font-size="11" fill="#ff4d9d" font-weight="500" letter-spacing="3" text-anchor="middle">COMPETITIVE FPS</text><rect x="610" y="30" width="265" height="156" rx="12" fill="#10161e" stroke="#1f2a37"/><g style="transform-origin:742.5px 90px;animation:float 4.0s ease-in-out 0.6s infinite"><polygon points="694.5,100 706.5,100 700.5,80" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke="#3ddc84"/><circle cx="728.5" cy="90" r="8" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke="#ff4d9d"/><path d="M750.5 82l12 16M762.5 82l-12 16" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke="#22e8ff"/><rect x="776.5" y="82" width="16" height="16" rx="1" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke="#8b5cff"/></g><text x="742.5" y="146" font-size="14" fill="#e9f1f7" font-weight="700" letter-spacing="1" text-anchor="middle">PLAYSTATION 5</text><text x="742.5" y="168" font-size="11" fill="#8b5cff" font-weight="500" letter-spacing="3" text-anchor="middle">CONSOLE GAMER</text><rect x="895" y="30" width="265" height="156" rx="12" fill="#10161e" stroke="#1f2a37"/><g style="transform-origin:1027.5px 90px;animation:float 4.4s ease-in-out 0.9s infinite"><circle cx="1027.5" cy="90" r="16" fill="none" stroke="url(#acc)" stroke-width="2.5"/><ellipse cx="1027.5" cy="90" rx="32" ry="9" transform="rotate(-20 1027.5 90)" fill="none" stroke="#8b5cff" stroke-width="1.8"/><g style="transform-origin:1027.5px 90px;animation:orb 9s linear infinite"><circle cx="1059.5" cy="90" r="2.6" fill="#ffb340"/></g></g><text x="1027.5" y="146" font-size="14" fill="#e9f1f7" font-weight="700" letter-spacing="1" text-anchor="middle">ANIME · SCI-FI · TECH</text><text x="1027.5" y="168" font-size="11" fill="#ffb340" font-weight="500" letter-spacing="3" text-anchor="middle">OFF-DUTY MODE</text><rect x="40" y="206" width="1120" height="76" rx="12" fill="#10161e" stroke="#