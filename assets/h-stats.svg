<svg width="1200" height="66" viewBox="0 0 1200 66" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CAREER TELEMETRY"><defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22e8ff"/><stop offset="1" stop-color="#8b5cff"/></linearGradient>
<linearGradient id="accv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22e8ff"/><stop offset="1" stop-color="#8b5cff"/></linearGradient>
<linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22e8ff" stop-opacity=".85"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#121a24" stroke-width="1"/></pattern></defs><style>.t{font-family:ui-monospace,'JetBrains Mono','SF Mono','Fira Code','DejaVu Sans Mono',Consolas,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.blink{animation:blink 1.06s steps(1,end) infinite}
@keyframes swipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes slide{0%{transform:translateX(0);opacity:0}15%{opacity:1}100%{transform:translateX(760px);opacity:0}}</style><g class="t"><text x="40" y="42" font-size="13" fill="#55657a" font-weight="600" letter-spacing="3" text-anchor="start">// 05</text><text x="100" y="43" font-size="20" fill="#e9f1f7" font-weight="700" letter-spacing="5" text-anchor="start">CAREER TELEMETRY</text><rect x="392" y="36" width="768" height="1.5" fill="url(#fadeR)"/><rect x="385" y="33" width="7" height="7" transform="rotate(45 388.5 36.5)" fill="#22e8ff"/><circle cx="406" cy="36.5" r="2" fill="#22e8ff" style="animation:slide 6s linear 1s infinite"/></g></svg>